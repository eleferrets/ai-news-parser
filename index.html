<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Hub - Stay Updated</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: 2px solid transparent;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-1px);
        }

        button.active {
            background: white;
            color: #667eea;
            border-color: white;
        }

        button.loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .article-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .article-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.18);
        }

        .article-image {
            width: 100%;
            height: 130px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            user-select: none;
        }

        .article-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .article-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .article-source {
            font-size: 0.8rem;
            color: #667eea;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .article-date {
            font-size: 0.78rem;
            color: #999;
        }

        .article-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #1a1a1a;
            line-height: 1.4;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .badge {
            padding: 3px 10px;
            background: #f0f0f8;
            color: #667eea;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .article-summary {
            font-size: 0.92rem;
            color: #555;
            line-height: 1.65;
            flex-grow: 1;
            margin-bottom: 16px;
        }

        .article-footer {
            margin-top: auto;
        }

        .btn-link {
            display: block;
            width: 100%;
            padding: 10px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            font-size: 0.88rem;
            transition: background 0.2s ease;
        }

        .btn-link:hover {
            background: #764ba2;
        }

        .status-message {
            background: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            color: #555;
            font-size: 0.9rem;
        }

        .status-message.loading {
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            font-weight: 600;
        }

        .status-message.error {
            background: #ffe0e0;
            color: #d32f2f;
        }

        .status-message.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .refresh-time {
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.82rem;
            margin-top: 10px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            padding: 50px 20px;
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .articles-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            button {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 AI News Hub</h1>
            <p>Stay updated with the latest breakthroughs in Artificial Intelligence</p>
        </header>

        <div class="controls">
            <button class="refresh-btn" onclick="fetchArticles(event)">🔄 Refresh</button>
            <button class="filter-btn active" onclick="filterCategory('all', this)">All News</button>
            <button class="filter-btn" onclick="filterCategory('anthropic', this)">Anthropic & Claude</button>
            <button class="filter-btn" onclick="filterCategory('research', this)">Research</button>
            <button class="filter-btn" onclick="filterCategory('open-source', this)">Open Source</button>
            <button class="filter-btn" onclick="filterCategory('applications', this)">Industry</button>
        </div>

        <div id="statusMessage" class="status-message" style="display: none;"></div>

        <div class="articles-grid" id="articlesGrid"></div>

        <div class="refresh-time">
            Last updated: <span id="updateTime">—</span>
        </div>
    </div>

    <script>
        const articles = [
            {
                id: 1,
                title: "Claude Opus 5 Released — Faster & More Affordable",
                source: "Anthropic",
                category: "anthropic",
                summary: "Anthropic launched Claude Opus 5 on July 24, 2026, offering 2.5x faster performance with frontier-level capabilities. It doubles performance on key benchmarks and comes within 0.5% of more expensive models while costing half as much.",
                link: "https://www.anthropic.com/news",
                emoji: "🧠",
                tags: ["Claude Opus 5", "Model Release", "Performance"],
                published: "2026-07-24"
            },
            {
                id: 2,
                title: "AI Agents Leap to 66% Task Success Rate",
                source: "Stanford HAI",
                category: "research",
                summary: "AI agents achieved a dramatic improvement on OSWorld benchmarks, jumping from 12% to ~66% task success on real computer tasks. This represents a major step forward in autonomous AI systems that can work independently across different operating systems.",
                link: "https://hai.stanford.edu/ai-index/2026-ai-index-report",
                emoji: "🤖",
                tags: ["AI Agents", "Benchmarks", "Autonomy"],
                published: "2026-06-18"
            },
            {
                id: 3,
                title: "Anthropic Launches Free Claude for Open Source",
                source: "Anthropic",
                category: "open-source",
                summary: "Anthropic announced Claude for Open Source, offering 6 months of free Claude Max access (worth $1,200) to open-source maintainers and contributors. This initiative aims to give back to the developer community powering the AI ecosystem.",
                link: "https://www.anthropic.com/news",
                emoji: "🔓",
                tags: ["Open Source", "Free Access", "Community"],
                published: "2026-07-30"
            },
            {
                id: 4,
                title: "Quantum-AI Hybrid Shows Promise for Complex Systems",
                source: "ScienceDaily",
                category: "research",
                summary: "Researchers demonstrated that combining quantum computing with AI can dramatically improve predictions of chaotic, complex systems. Quantum computers identify hidden patterns in data that traditional AI systems miss, opening new possibilities for scientific discovery.",
                link: "https://www.sciencedaily.com/news/computers_math/quantum_computers/",
                emoji: "⚛️",
                tags: ["Quantum Computing", "AI Hybrid", "Science"],
                published: "2026-08-05"
            },
            {
                id: 5,
                title: "Light-Based AI Computing Breakthrough",
                source: "ScienceDaily",
                category: "research",
                summary: "Researchers at Penn created hybrid light-matter particles that could dramatically speed up AI computing while using far less energy. This breakthrough may replace some electronic computing with ultra-efficient light-based alternatives, reducing power consumption significantly.",
                link: "https://www.sciencedaily.com/news/matter_energy/optics/",
                emoji: "💡",
                tags: ["Energy Efficient", "Computing", "Innovation"],
                published: "2026-08-14"
            }
        ];

        let currentFilter = 'all';
        let displayedArticles = [...articles];

        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function showStatus(message, type = 'info') {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = `status-message ${type}`;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        function renderArticles(articlesToShow) {
            const grid = document.getElementById('articlesGrid');

            if (articlesToShow.length === 0) {
                grid.innerHTML = '<div class="empty-state">No articles in this category yet — check back soon.</div>';
                return;
            }

            grid.innerHTML = articlesToShow.map(article => `
                <div class="article-card">
                    <div class="article-image">${article.emoji}</div>
                    <div class="article-content">
                        <div class="article-meta">
                            <span class="article-source">${article.source}</span>
                            <span class="article-date">${formatDate(article.published)}</span>
                        </div>
                        <h2 class="article-title">${article.title}</h2>
                        <div class="tags">
                            ${article.tags.map(tag => `<span class="badge">${tag}</span>`).join('')}
                        </div>
                        <p class="article-summary">${article.summary}</p>
                        <div class="article-footer">
                            <a href="${article.link}" target="_blank" rel="noopener noreferrer" class="btn-link">Read Full Article →</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(category, btn) {
            currentFilter = category;

            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            displayedArticles = category === 'all'
                ? [...articles]
                : articles.filter(a => a.category === category);

            renderArticles(displayedArticles);
        }

        function fetchArticles(event) {
            const btn = event.currentTarget;
            btn.classList.add('loading');
            btn.textContent = '⏳ Checking...';

            showStatus('Checking for new articles...', 'loading');

            setTimeout(() => {
                renderArticles(displayedArticles);
                btn.classList.remove('loading');
                btn.textContent = '🔄 Refresh';
                showStatus('✓ Up to date — content is curated and refreshed daily.', 'success');
                updateRefreshTime();
            }, 1200);
        }

        function updateRefreshTime() {
            const now = new Date();
            document.getElementById('updateTime').textContent = now.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderArticles(displayedArticles);
            updateRefreshTime();
        });
    </script>
</body>
</html>
