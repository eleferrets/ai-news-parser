<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Hub - Stay Updated</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: 2px solid transparent;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-1px);
        }

        button.active {
            background: white;
            color: #667eea;
            border-color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .article-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .article-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.18);
        }

        .article-image {
            width: 100%;
            height: 130px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            user-select: none;
        }

        .article-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .article-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .article-source {
            font-size: 0.8rem;
            color: #667eea;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .article-date {
            font-size: 0.78rem;
            color: #999;
        }

        .article-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #1a1a1a;
            line-height: 1.4;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .badge {
            padding: 3px 10px;
            background: #f0f0f8;
            color: #667eea;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .article-summary {
            font-size: 0.92rem;
            color: #555;
            line-height: 1.65;
            flex-grow: 1;
            margin-bottom: 16px;
        }

        .article-footer {
            margin-top: auto;
        }

        .btn-link {
            display: block;
            width: 100%;
            padding: 10px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            font-size: 0.88rem;
            transition: background 0.2s ease;
        }

        .btn-link:hover {
            background: #764ba2;
        }

        .status-message {
            padding: 12px 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.9);
            color: #555;
        }

        .status-message.loading {
            color: #667eea;
            font-weight: 600;
        }

        .status-message.error {
            background: #ffe0e0;
            color: #c62828;
        }

        .status-message.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .loading-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .skeleton-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            height: 340px;
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        .refresh-time {
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.82rem;
            margin-top: 10px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            padding: 50px 20px;
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            header h1 { font-size: 1.8rem; }
            .articles-grid { grid-template-columns: 1fr; }
            .loading-grid { grid-template-columns: 1fr; }
            .controls { flex-direction: column; align-items: stretch; }
            button { text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 AI News Hub</h1>
            <p>Stay updated with the latest breakthroughs in Artificial Intelligence</p>
        </header>

        <div class="controls">
            <button class="refresh-btn" id="refreshBtn" onclick="fetchArticles(event)">🔄 Refresh</button>
            <button class="filter-btn active" onclick="onFilter('all', this)">All News</button>
            <button class="filter-btn" onclick="onFilter('anthropic', this)">Anthropic & Claude</button>
            <button class="filter-btn" onclick="onFilter('research', this)">Research</button>
            <button class="filter-btn" onclick="onFilter('open-source', this)">Open Source</button>
            <button class="filter-btn" onclick="onFilter('applications', this)">Industry</button>
        </div>

        <div id="statusMessage" class="status-message" style="display: none;"></div>

        <div id="loadingGrid" class="loading-grid">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        </div>

        <div class="articles-grid" id="articlesGrid" style="display: none;"></div>

        <div class="refresh-time">
            Last updated: <span id="updateTime">—</span>
        </div>
    </div>

    <script>
        // rss2json converts RSS feeds to JSON — free, no key required
        const RSS2JSON = 'https://api.rss2json.com/v1/api.json?rss_url=';
        const FEEDS = [
            'https://venturebeat.com/category/ai/feed/',
            'https://techcrunch.com/tag/artificial-intelligence/feed/',
            'https://www.theverge.com/ai-artificial-intelligence/rss/index.xml',
        ];

        // Fallback if both feeds fail (network down, service outage, etc.)
        const FALLBACK_ARTICLES = [
            {
                id: 'f1', title: 'Claude Opus 5 Released — Faster & More Affordable',
                source: 'anthropic.com', category: 'anthropic',
                summary: 'Anthropic launched Claude Opus 5 on July 24, 2026, offering 2.5x faster performance with frontier-level capabilities. It doubles performance on key benchmarks and comes within 0.5% of more expensive models while costing half as much.',
                link: 'https://www.anthropic.com/news', emoji: '🧠',
                tags: ['Claude Opus 5', 'Model Release'], published: '2026-07-24T00:00:00Z',
            },
            {
                id: 'f2', title: 'AI Agents Leap to 66% Task Success Rate',
                source: 'hai.stanford.edu', category: 'research',
                summary: 'AI agents achieved a dramatic improvement on OSWorld benchmarks, jumping from 12% to ~66% task success on real computer tasks — a major step forward in autonomous AI systems.',
                link: 'https://hai.stanford.edu/ai-index/2026-ai-index-report', emoji: '🔬',
                tags: ['AI Agents', 'Benchmarks'], published: '2026-06-18T00:00:00Z',
            },
            {
                id: 'f3', title: 'Anthropic Launches Free Claude for Open Source',
                source: 'anthropic.com', category: 'open-source',
                summary: 'Anthropic announced 6 months of free Claude Max access (worth $1,200) to open-source maintainers and contributors, supporting the developer community powering the AI ecosystem.',
                link: 'https://www.anthropic.com/news', emoji: '🔓',
                tags: ['Open Source', 'Free Access'], published: '2026-07-30T00:00:00Z',
            },
            {
                id: 'f4', title: 'Quantum-AI Hybrid Shows Promise for Complex Systems',
                source: 'sciencedaily.com', category: 'research',
                summary: 'Researchers demonstrated that combining quantum computing with AI can dramatically improve predictions of chaotic, complex systems by identifying hidden patterns traditional AI misses.',
                link: 'https://www.sciencedaily.com/news/computers_math/quantum_computers/', emoji: '⚛️',
                tags: ['Quantum Computing', 'AI Hybrid'], published: '2026-08-05T00:00:00Z',
            },
            {
                id: 'f5', title: 'Light-Based AI Computing Breakthrough',
                source: 'sciencedaily.com', category: 'research',
                summary: 'Researchers at Penn created hybrid light-matter particles that could dramatically speed up AI computing while using far less energy, potentially replacing electronic computing on key workloads.',
                link: 'https://www.sciencedaily.com/news/matter_energy/optics/', emoji: '💡',
                tags: ['Energy Efficient', 'Computing'], published: '2026-08-14T00:00:00Z',
            },
        ];

        let allArticles = [];
        let displayedArticles = [];
        let currentFilter = 'all';

        // ── Fetch ────────────────────────────────────────────────────────────

        async function loadFeed(rssUrl) {
            const res = await fetch(RSS2JSON + encodeURIComponent(rssUrl));
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return data.status === 'ok' ? data.items : [];
        }

        async function fetchArticles(event) {
            const btn = event ? event.currentTarget : document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Loading…';
            showStatus('Fetching latest AI news…', 'loading');
            showSkeletons();

            try {
                const results = await Promise.allSettled(FEEDS.map(loadFeed));
                const items = results
                    .filter(r => r.status === 'fulfilled')
                    .flatMap(r => r.value);

                if (items.length === 0) throw new Error('All feeds failed');

                const seen = new Set();
                const unique = items.filter(item => {
                    if (!item.link || seen.has(item.link)) return false;
                    seen.add(item.link);
                    return true;
                });

                unique.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

                allArticles = unique.map((item, i) => {
                    const category = detectCategory(item.title, item.description);
                    return {
                        id: i,
                        title: item.title || 'Untitled',
                        source: extractDomain(item.link),
                        category,
                        summary: cleanSummary(item.description),
                        link: item.link,
                        emoji: categoryEmoji(category),
                        tags: extractTags(item.title),
                        published: item.pubDate,
                    };
                });

                applyFilter(currentFilter);
                updateRefreshTime();
                showStatus(`✓ ${allArticles.length} fresh articles loaded.`, 'success');

            } catch (err) {
                console.error('Feed fetch failed:', err);
                if (allArticles.length === 0) {
                    allArticles = FALLBACK_ARTICLES;
                    applyFilter(currentFilter);
                }
                showStatus('⚠ Could not reach live feeds — showing cached articles.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '🔄 Refresh';
                hideSkeletons();
            }
        }

        // ── Helpers ──────────────────────────────────────────────────────────

        function extractDomain(url) {
            try { return new URL(url).hostname.replace(/^www\./, ''); }
            catch { return url; }
        }

        function cleanSummary(html) {
            if (!html) return '';
            const text = (new DOMParser().parseFromString(html, 'text/html').body.textContent || '').trim().replace(/\s+/g, ' ');
            if (text.length <= 240) return text;
            return text.slice(0, text.lastIndexOf(' ', 240)) + '…';
        }

        function detectCategory(title = '', desc = '') {
            const t = (title + ' ' + desc).toLowerCase();
            if (/\banthrop(ic)?\b|\bclaude\b/.test(t)) return 'anthropic';
            if (/open.?source|\bgithub\b|\bllama\b|\bmistral\b|\bhugging\b|\bgemma\b|\bfalcon\b/.test(t)) return 'open-source';
            if (/\bhealth\b|\bmedic|\bhospital|\bfinance\b|\bbank|\beducat|\bschool|\benterprise\b|\bstartup\b|\bretail\b|\bmanufactur/.test(t)) return 'applications';
            return 'research';
        }

        function categoryEmoji(cat) {
            return { anthropic: '🧠', 'open-source': '🔓', applications: '🏢', research: '🔬' }[cat] || '📰';
        }

        const TAG_KEYWORDS = [
            'AI', 'GPT', 'Claude', 'OpenAI', 'Google', 'Meta', 'Apple', 'Microsoft',
            'Anthropic', 'DeepMind', 'NVIDIA', 'Robot', 'Agent', 'LLM', 'AGI',
            'Gemini', 'Grok', 'Llama', 'Mistral', 'Safety', 'Chip', 'Regulation',
        ];

        function extractTags(title = '') {
            const found = TAG_KEYWORDS.filter(k => title.toLowerCase().includes(k.toLowerCase()));
            return found.slice(0, 3).length ? found.slice(0, 3) : ['AI News'];
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            if (isNaN(d)) return dateStr;
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // ── Render ───────────────────────────────────────────────────────────

        function applyFilter(category) {
            currentFilter = category;
            displayedArticles = category === 'all'
                ? allArticles
                : allArticles.filter(a => a.category === category);
            renderArticles(displayedArticles);
        }

        function onFilter(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            applyFilter(category);
        }

        function renderArticles(list) {
            const grid = document.getElementById('articlesGrid');

            if (list.length === 0) {
                grid.innerHTML = '<div class="empty-state">No articles in this category — try refreshing or pick another filter.</div>';
                return;
            }

            grid.innerHTML = list.map(article => `
                <div class="article-card">
                    <div class="article-image">${article.emoji}</div>
                    <div class="article-content">
                        <div class="article-meta">
                            <span class="article-source">${article.source}</span>
                            <span class="article-date">${formatDate(article.published)}</span>
                        </div>
                        <h2 class="article-title">${article.title}</h2>
                        <div class="tags">
                            ${article.tags.map(t => `<span class="badge">${t}</span>`).join('')}
                        </div>
                        ${article.summary ? `<p class="article-summary">${article.summary}</p>` : ''}
                        <div class="article-footer">
                            <a href="${article.link}" target="_blank" rel="noopener noreferrer" class="btn-link">Read Full Article →</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ── UI state ─────────────────────────────────────────────────────────

        function showStatus(message, type = 'info') {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = `status-message ${type}`;
            el.style.display = 'block';
            if (type !== 'loading') setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        function showSkeletons() {
            document.getElementById('loadingGrid').style.display = 'grid';
            document.getElementById('articlesGrid').style.display = 'none';
        }

        function hideSkeletons() {
            document.getElementById('loadingGrid').style.display = 'none';
            document.getElementById('articlesGrid').style.display = 'grid';
        }

        function updateRefreshTime() {
            document.getElementById('updateTime').textContent = new Date().toLocaleTimeString([], {
                hour: '2-digit', minute: '2-digit', hour12: true,
            });
        }

        // ── Init ─────────────────────────────────────────────────────────────

        document.addEventListener('DOMContentLoaded', () => {
            fetchArticles(null);
        });
    </script>
</body>
</html>
