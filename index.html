<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI News Feed</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3348;
    --accent: #7c6ff7;
    --accent2: #5eead4;
    --text: #e2e8f0;
    --muted: #8892a4;
    --tag-bg: #1e2235;
    --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
  }

  /* ---- Header ---- */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(15,17,23,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }
  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  .refresh-btn svg { transition: transform 0.4s; }
  .refresh-btn.spinning svg { animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- Source filter tabs ---- */
  .tabs-wrap {
    overflow-x: auto;
    scrollbar-width: none;
    padding: 10px 16px;
    display: flex;
    gap: 6px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .tabs-wrap::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    transition: all 0.15s;
    white-space: nowrap;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab:hover:not(.active) { border-color: var(--accent); color: var(--text); }

  /* ---- Feed ---- */
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 12px 12px 80px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ---- Card ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .card:hover, .card:focus { border-color: var(--accent); background: var(--surface2); outline: none; }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .source-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--tag-bg);
    color: var(--accent2);
    letter-spacing: 0.2px;
  }
  .sep { color: var(--border); }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
  }
  .card-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-img {
    width: 100%;
    max-height: 180px;
    object-fit: cover;
    border-radius: 8px;
    margin-top: 2px;
    background: var(--surface2);
  }

  /* ---- States ---- */
  .status-wrap {
    padding: 48px 20px;
    text-align: center;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .error-icon { font-size: 32px; }
  .status-wrap p { font-size: 14px; max-width: 280px; }
  .retry-btn {
    margin-top: 4px;
    padding: 8px 20px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 14px;
    cursor: pointer;
  }

  /* ---- Last updated ---- */
  .footer-bar {
    text-align: center;
    padding: 12px;
    font-size: 12px;
    color: var(--muted);
  }

  /* ---- Skeleton loader ---- */
  .skel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .skel-line {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .skel-title { height: 16px; width: 90%; }
  .skel-meta { height: 11px; width: 40%; }

  /* ---- Empty ---- */
  .empty { padding: 60px 20px; text-align: center; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    AI News
  </div>
  <div class="header-right">
    <button class="refresh-btn" id="refreshBtn" onclick="refresh()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
      </svg>
      Refresh
    </button>
  </div>
</header>

<div class="tabs-wrap" id="tabs"></div>
<main id="feed"></main>
<div class="footer-bar" id="footer"></div>

<script>
// ── Sources ──────────────────────────────────────────────────────────────────
// All are free public RSS feeds, no API keys required.
// We route them through allorigins.win which is a free open CORS proxy.
const SOURCES = [
  {
    id: 'google',
    label: 'Google News',
    url: 'https://news.google.com/rss/search?q=artificial+intelligence+AI&hl=en-US&gl=US&ceid=US:en',
  },
  {
    id: 'techcrunch',
    label: 'TechCrunch AI',
    url: 'https://techcrunch.com/category/artificial-intelligence/feed/',
  },
  {
    id: 'verge',
    label: 'The Verge AI',
    url: 'https://www.theverge.com/rss/ai-artificial-intelligence/index.xml',
  },
  {
    id: 'venturebeat',
    label: 'VentureBeat AI',
    url: 'https://venturebeat.com/category/ai/feed/',
  },
  {
    id: 'wired',
    label: 'Wired AI',
    url: 'https://www.wired.com/feed/tag/artificial-intelligence/latest/rss',
  },
  {
    id: 'hnai',
    label: 'HN: AI',
    url: 'https://hnrss.org/newest?q=AI+LLM+GPT+machine+learning&points=20',
  },
];

// ── CORS Proxy ────────────────────────────────────────────────────────────────
// allorigins.win is free, open-source, and requires no signup.
// Falls back to corsproxy.io if allorigins fails.
function proxyUrl(rawUrl) {
  return `https://api.allorigins.win/get?url=${encodeURIComponent(rawUrl)}`;
}
function proxyUrl2(rawUrl) {
  return `https://corsproxy.io/?${encodeURIComponent(rawUrl)}`;
}

// ── RSS Parser ────────────────────────────────────────────────────────────────
function parseRSS(xmlText, sourceId) {
  const dp = new DOMParser();
  const doc = dp.parseFromString(xmlText, 'text/xml');
  const isAtom = !!doc.querySelector('feed');
  const items = isAtom
    ? Array.from(doc.querySelectorAll('entry'))
    : Array.from(doc.querySelectorAll('item'));

  return items.slice(0, 20).map(item => {
    const getText = (sel, ...fallbacks) => {
      for (const s of [sel, ...fallbacks]) {
        const el = item.querySelector(s);
        if (el) return (el.textContent || '').trim();
      }
      return '';
    };
    const getAttr = (sel, attr) => {
      const el = item.querySelector(sel);
      return el ? (el.getAttribute(attr) || '') : '';
    };

    const title = getText('title');
    const link = getAttr('link[href]', 'href') || getText('link') || getAttr('enclosure', 'url') || '';
    const pubDate = getText('pubDate') || getText('published') || getText('updated') || '';
    const desc = stripHtml(getText('description') || getText('summary') || getText('content'));

    // Try to find a thumbnail
    let img = '';
    const mediaThumbnail = item.querySelector('thumbnail');
    const mediaContent = item.querySelector('content[medium="image"], content[type^="image"]');
    const enclosure = item.querySelector('enclosure[type^="image"]');
    if (mediaThumbnail) img = mediaThumbnail.getAttribute('url') || '';
    else if (mediaContent) img = mediaContent.getAttribute('url') || '';
    else if (enclosure) img = enclosure.getAttribute('url') || '';
    if (!img) {
      // Try to extract from description html
      const imgMatch = (getText('description') || '').match(/<img[^>]+src=["']([^"']+)["']/i);
      if (imgMatch) img = imgMatch[1];
    }

    return { title, link, pubDate, desc, img, sourceId };
  }).filter(a => a.title && a.link);
}

function stripHtml(html) {
  const t = document.createElement('div');
  t.innerHTML = html;
  return t.textContent.replace(/\s+/g, ' ').trim();
}

// ── Time formatting ───────────────────────────────────────────────────────────
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  if (diff < 604800) return `${Math.floor(diff/86400)}d ago`;
  return d.toLocaleDateString();
}

// ── State ─────────────────────────────────────────────────────────────────────
let allItems = [];
let activeSource = 'all';
let loading = false;
let lastUpdated = null;

// ── Fetch one feed ────────────────────────────────────────────────────────────
async function fetchFeed(source) {
  try {
    const res = await fetch(proxyUrl(source.url), { signal: AbortSignal.timeout(12000) });
    if (!res.ok) throw new Error('proxy1 failed');
    const json = await res.json();
    return parseRSS(json.contents || '', source.id);
  } catch {
    // fallback proxy
    try {
      const res2 = await fetch(proxyUrl2(source.url), { signal: AbortSignal.timeout(12000) });
      if (!res2.ok) throw new Error('proxy2 failed');
      const text2 = await res2.text();
      return parseRSS(text2, source.id);
    } catch {
      return [];
    }
  }
}

// ── Render helpers ────────────────────────────────────────────────────────────
function renderSkeletons(n) {
  const feed = document.getElementById('feed');
  feed.innerHTML = Array.from({length: n}, () => `
    <div class="skel">
      <div class="skel-line skel-meta"></div>
      <div class="skel-line skel-title"></div>
      <div class="skel-line" style="width:75%"></div>
    </div>
  `).join('');
}

function renderFeed() {
  const feed = document.getElementById('feed');
  const items = activeSource === 'all'
    ? allItems
    : allItems.filter(it => it.sourceId === activeSource);

  if (items.length === 0) {
    feed.innerHTML = `<div class="empty">No articles found for this source yet.</div>`;
    return;
  }

  feed.innerHTML = items.map(item => {
    const src = SOURCES.find(s => s.id === item.sourceId);
    const label = src ? src.label : item.sourceId;
    const when = timeAgo(item.pubDate);
    const img = item.img
      ? `<img class="card-img" src="${escHtml(item.img)}" alt="" loading="lazy" onerror="this.remove()">`
      : '';
    return `
      <a class="card" href="${escHtml(item.link)}" target="_blank" rel="noopener noreferrer">
        <div class="card-meta">
          <span class="source-badge">${escHtml(label)}</span>
          ${when ? `<span class="sep">·</span><span>${escHtml(when)}</span>` : ''}
        </div>
        <div class="card-title">${escHtml(item.title)}</div>
        ${item.desc ? `<div class="card-desc">${escHtml(item.desc)}</div>` : ''}
        ${img}
      </a>`;
  }).join('');
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  const counts = {};
  allItems.forEach(it => { counts[it.sourceId] = (counts[it.sourceId] || 0) + 1; });
  const allTab = `<div class="tab ${activeSource==='all'?'active':''}" onclick="setSource('all')">All (${allItems.length})</div>`;
  const srcTabs = SOURCES.map(s => {
    const c = counts[s.id] || 0;
    return `<div class="tab ${activeSource===s.id?'active':''}" onclick="setSource('${s.id}')">${escHtml(s.label)}${c ? ` (${c})` : ''}</div>`;
  }).join('');
  tabs.innerHTML = allTab + srcTabs;
}

function renderError() {
  document.getElementById('feed').innerHTML = `
    <div class="status-wrap">
      <div class="error-icon">⚠️</div>
      <p>Couldn't load news feeds. Check your connection and try again.</p>
      <button class="retry-btn" onclick="refresh()">Try again</button>
    </div>`;
}

function updateFooter() {
  const f = document.getElementById('footer');
  if (lastUpdated) f.textContent = `Last updated ${timeAgo(lastUpdated)}`;
}

// ── Main load ─────────────────────────────────────────────────────────────────
function setSource(id) {
  activeSource = id;
  renderTabs();
  renderFeed();
}

async function refresh() {
  if (loading) return;
  loading = true;
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  renderSkeletons(6);

  const results = await Promise.allSettled(SOURCES.map(s => fetchFeed(s)));

  allItems = [];
  results.forEach(r => {
    if (r.status === 'fulfilled') allItems.push(...r.value);
  });

  // Sort newest first, deduplicate by URL
  const seen = new Set();
  allItems = allItems
    .filter(it => { if (seen.has(it.link)) return false; seen.add(it.link); return true; })
    .sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

  loading = false;
  btn.classList.remove('spinning');

  if (allItems.length === 0) {
    renderError();
  } else {
    lastUpdated = new Date();
    renderTabs();
    renderFeed();
    updateFooter();
  }

  // Auto-refresh every 15 minutes
  clearTimeout(window._autoRefresh);
  window._autoRefresh = setTimeout(refresh, 15 * 60 * 1000);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
renderTabs();
refresh();
</script>
</body>
</html>
